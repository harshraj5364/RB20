<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A postcard</title><link rel="stylesheet" href="common.css"><style>
.bk2{top:auto;bottom:5vh;left:50%;translate:-50% 0}
main{gap:1.2rem}
.ww{display:flex;gap:2.4rem;align-items:center;justify-content:center;flex-wrap:wrap;width:min(1000px,94vw)}
.ttl{font:400 clamp(2.4rem,6vw,4.2rem)/1.15 'Kaushan Script',cursive;color:#f6efe6;text-align:right;max-width:min(380px,90vw);min-height:4.6em}
#pc{position:relative;width:min(560px,94vw);rotate:-3deg;box-shadow:0 26px 44px -18px rgba(0,0,0,.7)}
.env0{position:absolute;inset:-18px -30px -18px 30px;background:#c4a97c;z-index:-1;rotate:4deg}
.cd{position:relative;background:#fffdf6;padding:1rem 1.2rem;display:grid;grid-template-columns:1fr 1.25fr;gap:1rem;border:10px solid transparent;border-image:repeating-linear-gradient(135deg,#d9455e 0 10px,#fff 10px 20px,#4c78c9 20px 30px,#fff 30px 40px) 10}
.cd h3{font:700 1.5rem 'Special Elite',serif;color:#c0384f;letter-spacing:.06em}
.lines span{display:block;border-bottom:1px solid #8a7a6a;font:400 .9rem 'Special Elite',serif;color:#4a3b30;margin:.6rem 0;text-align:left}
.msg{font:500 clamp(1.05rem,2.4vw,1.3rem)/1.5 'Dancing Script',cursive;color:#3a2f55;text-align:left}
.stp{position:absolute;right:10px;top:8px;width:46px;height:52px;border:2px dashed #a8741f;display:grid;place-items:center;font-size:1.4rem;background:#fff;rotate:3deg}
.flw{position:absolute;right:6px;bottom:2px;font-size:3.4rem}.flw img{width:90px}
</style></head><body data-bg="crim" data-p="0"><main>
<div class="ww"><article id="pc"><div class="env0"></div><div class="cd"><div><h3>POST CARD</h3><div class="lines"><span>To: Riya</span><span id="fm"></span><span>Date: 19/01</span></div></div><div><p class="msg" id="mg"></p></div><div class="stp">🌸</div><div class="flw" id="fw">🌺</div></div></article><h2 class="ttl" id="tt"></h2></div><button class="back bk2" onclick="go('gifts.html')">Back</button>
</main><script src="config.js"></script><script src="common.js"></script><script>
$('fm').textContent='From: '+(CFG.from||'your friend');
$('mg').innerHTML=`Hey ${CFG.to},<br>To my favourite person: ${CFG.postcard}`;
ast('poinsettia',s=>{if(s)$('fw').innerHTML=`<img src="${s}" alt="">`});
setTimeout(()=>tw($('tt'),'A letter for the prettiest girl in the whole universe',null,75),900);
</script></body></html>
