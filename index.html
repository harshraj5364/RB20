<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Riya</title><link rel="stylesheet" href="common.css"><style>
main{flex-direction:row;flex-wrap:wrap;gap:2rem 3.5rem;text-align:left;width:min(1100px,96vw)}
#col{position:relative;width:min(380px,84vw);aspect-ratio:1;flex:none}
#col>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#col i{position:absolute;width:44%;background:#fff;padding:2.4%;padding-bottom:9%;box-shadow:0 12px 24px -10px rgba(0,0,0,.6);font-style:normal}
#col i img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.kc{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.kc h2{font:600 clamp(1.7rem,4vw,2.5rem)/1.2 'Outfit',sans-serif;color:#fff3ec;text-align:center}.kc h2 b{font-weight:800}
.bx{gap:1rem}.bx i{width:3.3rem;height:3.3rem;border:3px solid #f6e9e4;border-radius:10px;font:800 2rem 'Outfit',sans-serif;color:#111}
.bx i.f{background:#fff}.bx i.f::after{content:'✱'}
.kp{gap:.8rem 1.3rem}
.gk{width:clamp(70px,16vw,92px);aspect-ratio:.92;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 100'><path d='M45 30C30 6 8 14 24 30C32 36 42 32 45 30C48 32 58 36 66 30C82 14 60 6 45 30Z' fill='%23111'/><rect x='8' y='30' width='74' height='66' rx='3' fill='%23111'/></svg>") center/contain no-repeat;color:#f6d24a;font:400 2.7rem 'Gochi Hand',cursive;padding-top:20%}
.gk:nth-child(3n+1){rotate:-4deg}.gk:nth-child(3n+2){rotate:3deg}.gk:nth-child(3n){rotate:-2deg}
#m{font-size:1.05rem;min-height:1.5em;color:#ffd7e0}
</style></head><body data-gate="1" data-bg="mag" data-p="0"><main>
<div id="col" class="rise"></div>
<div class="kc rise" style="--i:2"><h2>Enter the <b>SECRET CODE</b></h2><div class="bx" id="bx"><i></i><i></i><i></i><i></i></div><div class="kp" id="kp"></div><small id="m">hint: the year you were born</small></div>
</main><script src="config.js"></script><script src="common.js"></script><script>
const col=$('col'),m=$('m');
ast('collage',s=>{if(s)col.innerHTML=`<img src="${s}" alt="">`;else CFG.polaroids.slice(0,3).forEach((p,i)=>{const f=document.createElement('i');f.style.cssText=`left:${i*28}%;top:${[4,34,14][i]}%;rotate:${[-8,5,-3][i]}deg;z-index:${i}`;f.innerHTML='<img alt="">';pic(p.src,i,u=>f.firstChild.src=u);col.appendChild(f)})});
keypad({code:'2007',ok:()=>{sessionStorage.setItem('riya','1');m.textContent='opening…';petals(40,true);setTimeout(()=>go('birthday.html'),900)},bad:b=>{shk(b);m.textContent='hmm, not quite… try again'}});
</script></body></html>
