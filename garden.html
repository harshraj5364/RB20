<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The garden</title><link rel="stylesheet" href="common.css"><style>
.bk2{top:auto;bottom:5vh;left:50%;translate:-50% 0}
body{--ink:#fff;--tc:#6a8a3a;background:#8fb860}
#gd{position:fixed;inset:0;z-index:1;overflow:hidden;background:linear-gradient(#f3b79a,#f7d7b4 38%,#9cb860 39%,#5f8a2e)}
#gd i{position:absolute;font-style:normal;line-height:1;transform-origin:50% 100%;animation:sw2 3s ease-in-out infinite alternate}
@keyframes sw2{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.tgb{position:fixed;right:4vw;top:12vh;z-index:4;max-width:min(230px,52vw);background:#e8d3ae;color:#4a3a2a;border-radius:6px 14px 6px 14px;padding:.8rem 1rem;font:700 clamp(.95rem,2.4vw,1.2rem)/1.3 'Gaegu',cursive;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.cg{position:fixed;right:2vw;bottom:14vh;z-index:4;font-size:4.4rem}.cg img{width:clamp(70px,16vw,130px)}
.back{font:700 1.3rem 'Kaushan Script',cursive;color:#4a2d12;background:linear-gradient(#f2e2bd,#dcc08a);border:2px dashed #9b7a45;border-radius:10px;padding:.35em 1.6em;box-shadow:0 4px 10px rgba(0,0,0,.4);cursor:pointer}
</style></head><body data-p="0"><main>
<div id="gd"></div>
<p class="tgb">a bouquet is not enough for you so I bring the whole garden for you</p>
<div class="cg" id="cg">🐱</div><button class="back bk2" onclick="go('gifts.html')">Back</button>
</main><script src="config.js"></script><script src="common.js"></script><script>
ast('garden',s=>{const g=$('gd');if(s)g.style.background=`url(${s}) center/cover`;else{let h='';for(let r=0;r<9;r++){const y=44+r*r*.5+r*2,sz=18+r*r*1.2;for(let c=0;c<6+r*2;c++)h+=`<i style="left:${R(-2,100)}%;top:${y}%;font-size:${sz}px;animation-delay:${R(-3,0).toFixed(1)}s">🌻</i>`}g.innerHTML=h}});
ast('catGarden',s=>{if(s)$('cg').innerHTML=`<img src="${s}" alt="">`});
</script></body></html>
