<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday</title><link rel="stylesheet" href="common.css"><style>

</style></head><body data-bg="bokeh" data-p="0"><main>

<svg id="ht" viewBox="0 0 100 100" width="110"><defs><radialGradient id="hg" cx="35%" cy="28%"><stop offset="0" stop-color="#ffc3d6"/><stop offset=".4" stop-color="#ec4f86"/><stop offset="1" stop-color="#b0124c"/></radialGradient></defs><path d="M50 90C8 60 6 26 28 18C40 14 48 20 50 30C52 20 60 14 72 18C94 26 92 60 50 90Z" fill="url(#hg)"/><ellipse cx="34" cy="32" rx="8" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 34 32)"/></svg>

<p id="t2">PULL &amp; RELEASE</p></section>

</main><script src="config.js"></script><script src="common.js"></script><script>
const s1=$('s1'),s2=$('s2'),ht=$('ht'),bw=$('bw'),sg=$('sg'),ar=$('ar');let shot=0,pulling=0,sx=0,sy=0;
const gm=()=>{const a=bw.getBoundingClientRect(),h=ht.getBoundingClientRect(),k=a.width/150,nx0=a.left+62*k,ny0=a.top+74*k,hx=h.left+h.width/2,hy=h.top+h.height/2;return{k,hx,hy,ang:Math.atan2(hy-ny0,hx-nx0),dist:Math.hypot(hx-nx0,hy-ny0)}};
const setAr=d=>{const g=gm(),x=62-Math.cos(g.ang)*d/g.k,y=74-Math.sin(g.ang)*d/g.k;ar.style.transform=`translate(${x}px,${y}px) rotate(${g.ang}rad)`;sg.setAttribute('points',`12,8 ${x},${y} 142,140`)};
setAr(0);
const pull=e=>{const g=gm();return Math.max(0,Math.min(70,-((e.clientX-sx)*Math.cos(g.ang)+(e.clientY-sy)*Math.sin(g.ang))))};
bw.onpointerdown=e=>{if(shot)return;pulling=1;sx=e.clientX;sy=e.clientY;bw.setPointerCapture(e.pointerId)};
bw.onpointermove=e=>{if(pulling)setAr(pull(e))};
bw.onpointerup=e=>{if(!pulling)return;pulling=0;pull(e)>14?shoot():setAr(0)};
function shoot(){if(shot)return;shot=1;const g=gm(),L=(g.dist+20)/g.k;ar.style.transition='transform .5s cubic-bezier(.4,0,.9,.6)';sg.setAttribute('points','12,8 62,74 142,140');ar.style.transform=`translate(${62+Math.cos(g.ang)*L}px,${74+Math.sin(g.ang)*L}px) rotate(${g.ang}rad)`;setTimeout(()=>burst(g.hx,g.hy),480)}
function burst(x,y){ht.style.display='none';for(let i=0;i<26;i++){const p=document.createElement('i');p.className='pb';p.style.cssText=`left:${x}px;top:${y}px;--dx:${R(-90,90)}px;--dy:${R(-90,90)}px;background:${P(['#ec4f86','#ffb3cb','#f5b94a'])}`;s1.appendChild(p)}
 setTimeout(()=>{s2.style.clipPath=`circle(0 at ${x}px ${y}px)`;s2.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>{s2.style.transition='clip-path 1s ease-in';s2.style.clipPath=`circle(150vmax at ${x}px ${y}px)`}));setTimeout(()=>s2.classList.add('go'),900);setTimeout(show3,5400)},500)}
setTimeout(()=>{if(!shot){setAr(60);setTimeout(shoot,700)}},9000);
function show3(){s1.remove();B.classList.add('s3');tree();petals(26);s2.style.transition='opacity 1s';s2.style.opacity=0;setTimeout(()=>s2.remove(),1000);setTimeout(()=>nx.classList.add('show'),8000);setTimeout(()=>autoScroll(70,0,()=>auto(12000)),9500)}
function tree(){const t=$('tr'),br=[['M200 560C198 500 204 440 200 380',14],['M200 380C186 350 156 330 126 292',9],['M126 292C108 274 84 262 66 228',6],['M126 292C124 262 112 236 96 200',5],['M156 330C146 300 150 262 142 222',5],['M142 222C130 196 128 170 140 140',4],['M200 380C214 350 244 330 274 292',9],['M274 292C292 274 316 262 334 228',6],['M274 292C276 262 288 236 304 200',5],['M244 330C254 300 250 262 258 222',5],['M258 222C270 196 272 170 260 140',4],['M200 380C198 336 204 296 200 250',7],['M200 250C186 224 180 196 188 160',4],['M200 250C216 224 222 196 212 160',4],['M200 310C176 290 164 262 166 224',3],['M200 310C224 290 236 262 234 224',3]];
let h=br.map(([d,w],i)=>`<path class="br" pathLength="1" d="${d}" stroke-width="${w}" style="animation-delay:${(i*.2).toFixed(2)}s"/>`).join('');
const C=['#e0457f','#f06fa0','#f8a1bf','#f5a623','#f8c14b','#d23a78'];let n=0;
while(n<190){const x=R(-1.2,1.2),y=R(-1.2,1.3);if(Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0){n++;const px=200+x*124,py=205-y*106;h+=`<path class="ht" d="M0 3C-5-2-5-8 0-6C5-8 5-2 0 3Z" fill="${P(C)}" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${R(-40,40).toFixed(0)}) scale(${R(1.6,2.6).toFixed(2)})" style="animation-delay:${(2.6+(320-py)/280*2.6+R(0,.3)).toFixed(2)}s,${n%9==0?(8+R(0,10)).toFixed(1):9999}s"/>`}}
t.innerHTML=h}
const n0=new Date(),td=n0.getMonth()==0&&n0.getDate()==19;let T=new Date(n0.getFullYear(),0,19);if(!td&&n0>T)T=new Date(n0.getFullYear()+1,0,19);
const cd=$('cd');if(td)$('cp').remove();
cd.innerHTML=td?'<h2>Today is your day! 🎂</h2>':['days','hours','minutes','seconds'].map(l=>`<div class="t"><b>00</b><small>${l}</small></div>`).join('');
const bs=cd.querySelectorAll('b');
(function k(){if(td)return;const d=Math.max(0,T-new Date());[d/864e5,d/36e5%24,d/6e4%60,d/1e3%60].forEach((v,i)=>{const s=String(Math.floor(v)).padStart(2,'0');if(bs[i].textContent!=s){bs[i].textContent=s;bs[i].animate([{transform:'translateY(-14px)',opacity:.2},{transform:'none',opacity:1}],300)}});setTimeout(k,1000)})();
</script></body></html>
