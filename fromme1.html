<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>From me to you</title><link rel="stylesheet" href="common.css"><style>
#dried{position:fixed;left:0;top:0;width:min(150px,28vw);z-index:5;pointer-events:none;font-size:3.6rem;filter:drop-shadow(4px 6px 6px rgba(0,0,0,.3))}#dried img{width:100%;display:block}
main{justify-content:flex-start;padding:0;gap:0}
.sec{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3rem;width:100%;padding:14vh 0 8vh}
.hh{font:700 clamp(3.4rem,11vw,6.6rem)/1.1 'Dancing Script',cursive;color:#7a1f1f}
.sub{font:600 clamp(1.8rem,5.4vw,2.7rem) 'Caveat',cursive;color:#52201a}
#art{width:min(460px,86vw)}#art img{width:100%;display:block}
.dts{color:#7a1f1f;font-size:1rem;letter-spacing:.3em}
.qc{width:min(620px,92vw);background:linear-gradient(#fbf3e4,#f6e6cf);border:1px solid rgba(160,110,70,.25);border-radius:8px;padding:2.2rem 1.6rem;box-shadow:0 14px 30px -18px rgba(120,60,30,.5);position:relative;font:700 clamp(2rem,6.2vw,2.9rem)/1.7 'Caveat',cursive;color:#2e1612}
.qc::before,.qc::after{content:'♡';position:absolute;color:#d9556a;font-size:1.1rem}.qc::before{left:12px;top:8px}.qc::after{right:12px;bottom:8px}
mark{background:none;padding:0 .25em;border-radius:3px;color:inherit}
</style></head><body data-bg="peach" data-p="0"><main>
<div id="dried"></div>
<section class="sec"><h1 class="hh rise">From me to you.</h1><p class="sub rise" style="--i:3">This is how much you mean to me.</p><div id="art" class="rise" style="--i:5"></div><div class="dts rise" style="--i:6">● ♡ ●</div></section>
<section class="sec"><div class="qc rv"><p>In your <mark style="background:#f6a9b6">smile</mark>, I found my <mark style="background:#a9d9b0">peace</mark>.</p><p>In your <mark style="background:#f6a9b6">friendship</mark>, I found my <mark style="background:#f0cf78">home</mark>.</p></div></section>
<button class="next" data-after="6000">keep going</button>
</main><script src="config.js"></script><script src="common.js"></script><script>
ast('dried',s=>$('dried').innerHTML=s?`<img src="${s}" alt="">`:'🥀');
const put=s=>$('art').innerHTML=s?`<img src="${s}" alt="">`:'<div style="font-size:6rem">💐</div>';
ast('fromme',s=>s?put(s):ast('bouquetWhite',put));
rv('.rv');
autoScroll(56,3500,()=>auto(6500));
</script><script src="motion.js"></script></body></html>
