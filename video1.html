<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Her videos</title><link rel="stylesheet" href="common.css"><style>
main{justify-content:flex-start;padding:7vh 0 12vh;gap:2.4rem}
.vgrid{display:grid;grid-template-columns:1fr;gap:2.8rem;width:min(1120px,94vw)}
@media(min-width:900px){.vgrid{grid-template-columns:1fr 1fr;gap:3rem}}
.vc{display:flex;flex-direction:column;gap:1rem;text-align:left}
.vbox{position:relative;width:100%;max-width:540px;min-height:200px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(138,42,92,.55);border:8px solid #fff;background:#1c1018}
.vbox video{display:block;width:100%;max-height:54dvh;background:#1c1018;object-fit:contain}
.pl2{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:2.2rem;color:#8a2a5c;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.miss{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:1.4rem;color:#fff;font:600 1.3rem/1.5 'Outfit',sans-serif;background:linear-gradient(135deg,#7a2a60,#c45a8a)}
.vtx{max-width:540px;margin:0 auto;width:100%}
.vn{font:700 1.05rem 'Outfit',sans-serif;letter-spacing:.3em;color:#9a3a62}
.vtx h2{font:700 clamp(2.6rem,9vw,4.2rem)/1.05 'Playfair Display',serif;font-style:italic;color:#5a1640;margin:.2rem 0 .7rem}
.vtx p{font:700 clamp(1.55rem,5.6vw,2rem)/1.5 'Cormorant Garamond',serif;color:#241022}
</style></head><body data-bg="dream" data-p="12"><main>
<div class="vgrid" id="vg"></div>
<button class="next" data-after="7000">next ›</button>
</main><script src="config.js"></script><script src="common.js"></script><script>
const I=1,L=CFG.videos.slice((I-1)*2,(I-1)*2+2),TOT=CFG.videos.length;
$('vg').innerHTML=L.map((V,k)=>`<article class="vc" id="c${k}"><div class="vbox"><video id="v${k}" controls playsinline preload="auto"></video><button class="pl2" id="p${k}" hidden>▶</button><div class="miss" id="m${k}"><span>Her video will appear here.<br>Upload it to the videos folder.</span></div></div><div class="vtx"><p class="vn">0${(I-1)*2+k+1} / 0${TOT}</p><h2>${V.h}</h2><p>${V.t}</p></div></article>`).join('');
const vs=L.map((V,k)=>$('v'+k));
/* the first video plays, then the page scrolls to the second and plays it, then the next page opens */
function next(k){if(k+1<L.length){$('c'+(k+1)).scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>start(k+1),900)}else auto(2500)}
function start(k){vs[k].play().catch(()=>{if($('m'+k).style.display!=='grid')$('p'+k).hidden=false})}
L.forEach((V,k)=>{const v=vs[k];
  v.onerror=()=>{$('m'+k).style.display='grid';$('p'+k).hidden=true;setTimeout(()=>next(k),3500)};
  v.onended=()=>next(k);v.onplay=()=>{$('p'+k).hidden=true;autoStop()};$('p'+k).onclick=()=>v.play();v.src=V.src});
start(0);
setTimeout(()=>{if(vs.every(v=>v.paused&&!v.ended))auto(14000)},18000);
</script><script src="motion.js"></script></body></html>
